replicaCount: 3
image:
  repository: ghcr.io/parkerwinner/kor-assetforge-api
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  host: api.assetforge.example.com
  tlsSecret: assetforge-api-tls
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: 1000m, memory: 1Gi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
secrets:
  name: assetforge-api-secrets
