apiVersion: v1
kind: Service
metadata:
  name: {{ include "kor-assetforge.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "kor-assetforge.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kor-assetforge.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "kor-assetforge.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "kor-assetforge.fullname" . }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: {{ .Values.secrets.name }}}}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe: {httpGet: {path: /health, port: 8080}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kor-assetforge.fullname" . }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "kor-assetforge.fullname" . }}}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}}}
