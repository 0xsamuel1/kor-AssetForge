# Kubernetes manifests for a horizontally scaled kor-AssetForge API.
#
# Apply with: kubectl apply -f kubernetes/deployment.yaml -n assetforge
#
# The API is stateless (see docs/SCALING_GUIDE.md), so the Deployment can be
# scaled to any replica count behind the Service. Secrets are expected to exist
# before apply; create them with:
#   kubectl create secret generic assetforge-api-secrets -n assetforge \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=JWT_SECRET='...'
---
apiVersion: v1
kind: Namespace
metadata:
  name: assetforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: assetforge-api-config
  namespace: assetforge
data:
  APP_ENV: "production"
  SERVER_PORT: "8080"
  STELLAR_NETWORK: "mainnet"
  # Per-instance pool size; keep replicas * DB_MAX_OPEN_CONNS below the
  # database max_connections budget (see docs/SCALING_GUIDE.md §3).
  DB_MAX_OPEN_CONNS: "10"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "30m"
  DB_CONN_MAX_IDLE_TIME: "5m"
  CACHE_L1_MAX_ENTRIES: "10000"
  CACHE_L1_MAX_SIZE_MB: "64"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetforge-api
  namespace: assetforge
  labels:
    app: assetforge-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: assetforge-api
  template:
    metadata:
      labels:
        app: assetforge-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/parkerwinner/kor-assetforge-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assetforge-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetforge-api-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: assetforge-api-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: assetforge-api-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                # Give the load balancer time to deregister this pod
                # before the process receives SIGTERM.
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: assetforge-api
  namespace: assetforge
  labels:
    app: assetforge-api
spec:
  type: ClusterIP
  selector:
    app: assetforge-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetforge-api
  namespace: assetforge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.assetforge.example.com]
      secretName: assetforge-api-tls
  rules:
    - host: api.assetforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assetforge-api
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: assetforge-api
  namespace: assetforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: assetforge-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: assetforge-api
  namespace: assetforge
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: assetforge-api
