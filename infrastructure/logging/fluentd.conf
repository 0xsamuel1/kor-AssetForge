# Fluentd — log aggregation for kor-AssetForge (issue #318)
# Tails Docker json-file logs, parses the zap JSON payload, and forwards
# structured records to Elasticsearch. Mounted at /fluentd/etc/fluent.conf
# by the `fluentd` service in docker-compose.yml.

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Docker containers ship logs via the fluentd driver.
<source>
  @type tail
  @id docker_logs
  path /var/log/containers/*.log
  pos_file /var/log/fluentd-containers.log.pos
  tag container.*
  read_from_head false
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S%z
    keep_time_key true
  </parse>
</source>

# Parse embedded zap JSON message field when present.
<filter container.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# Enrich with trace/request correlation keys when present.
<filter container.**>
  @type record_transformer
  <record>
    service ${record["service"] || record["container_name"] || "kor-assetforge"}
  </record>
</filter>

<match container.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix kor-assetforge
  # 30d hot retention; adjust index lifecycle in Elasticsearch for prod.
  include_tag_key true
  tag_key container_tag
  reconnect_on_error true
  <buffer>
    @type file
    path /var/log/fluentd-buf
    flush_interval 5s
    retry_forever true
  </buffer>
</match>
