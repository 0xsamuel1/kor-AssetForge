groups:
  - name: kor-assetforge-error-budget
    interval: 30s
    rules:
      # 0.1% error budget over 30d, multi-window burn-rate alerts.
      # Fast burn: 2% error rate sustained -> page within ~1h budget consumption.
      - alert: ErrorBudgetFastBurn
        expr: |
          (
            sum(rate(app_errors_total[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error budget fast burn"
          description: "Error rate is >20x budget (0.1%) for 5m. Check /metrics app_errors_total{code,endpoint} and trace_id logs."

      # Slow burn: 0.2%+ sustained -> ticket within ~6h window.
      - alert: ErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(app_errors_total[30m]))
            /
            clamp_min(sum(rate(http_requests_total[30m])), 0.001)
          ) > 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Error budget slow burn"
          description: "Error rate is >2x budget (0.1%) for 30m."

      # Per-endpoint precision alert: any templated route breaching 1%.
      - alert: EndpointErrorRateHigh
        expr: |
          (
            sum by (endpoint) (rate(app_errors_total[5m]))
            /
            clamp_min(sum by (endpoint) (rate(http_requests_total[5m])), 0.001)
          ) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint error rate above 1%"
          description: "Endpoint {{ $labels.endpoint }} error rate is {{ $value | humanizePercentage }}."
