name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to deploy
        required: true
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Deploy Helm release
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          helm upgrade --install assetforge helm/kor-assetforge \
            --namespace assetforge --create-namespace \
            --set image.tag="$IMAGE_TAG" \
            --kubeconfig "$RUNNER_TEMP/kube/config" \
            --wait --timeout 5m
