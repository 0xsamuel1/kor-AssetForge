name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Install deps
        run: |
          cd backend
          go mod download
      - name: Run backend tests
        run: |
          cd backend
          go test $(go list ./... | grep -v /tests/performance) -v -covermode=atomic -coverprofile=coverage.out
      - name: Report backend coverage
        run: |
          cd backend
          go tool cover -func=coverage.out | tail -n 1
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  test-contracts:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    # Smart-contract test tooling currently hits an upstream ed25519-dalek
    # resolution issue, so this job is informational until that is resolved.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run contract tests
        run: |
          cd contracts
          cargo test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test -- --ci
      - name: Run frontend build
        run: |
          cd frontend
          npm run build

  e2e-frontend:
    name: Frontend E2E
    runs-on: ubuntu-latest
    # E2E coverage is being stabilized; failures are reported but do not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  mobile-lint:
    name: Mobile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile deps
        run: |
          cd mobile
          npm install
      - name: Run lint
        run: |
          cd mobile
          npm run lint || true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go, javascript, typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
